<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Envision Studios</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f2e2;
      color: #3a2a1b;
      text-align: center;
    }
    .hero {
      padding: 100px 20px;
      background-color: #f0f2e2;
    }
    .hero h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }
    .hero p {
      font-size: 20px;
      color: #6b5e53;
    }
    .categories {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin: 50px 0;
    }
    .category {
      width: 300px;
      height: 200px;
      background-color: #e0d9ce;
      margin: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .category:hover {
      background-color: #d4cfc7;
    }
    .products {
      margin: 50px 20px;
    }
    .footer {
      margin-top: 50px;
      padding: 30px;
      background-color: #3a2a1b;
      color: #f0f2e2;
    }
  </style>
</head>
<body>

  <div class="hero">
    <h1>Envision Studios</h1>
    <p>Where Art Meets Fashion</p>
  </div>

  <div class="categories">
    <div class="category">جاهز للشراء</div>
    <div class="category">تصميم خاص</div>
  </div>

  <div class="products">
    <h2>منتجات مختارة</h2>
    <!-- المنتجات تضاف هنا لاحقًا -->
  </div>

  <div class="footer">
    <p>© 2025 Envision Studios. جميع الحقوق محفوظة.</p>
  </div>

</body>
</html>
